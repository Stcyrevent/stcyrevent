# ============================================
# FAQ — shown at the bottom of the Services page
# Keep answers to one or two short sentences.
# ============================================

heading: Questions

questions:
  - q: How far in advance should I reach out?
    a: Ideally 3–6 months ahead for larger events and 6–8 weeks for smaller ones. Tighter timelines are often possible, so just ask.

  - q: Do you work outside Vancouver?
    a: Yes. I work with teams across Canada, on site or remotely, and quote any travel up front.

  - q: How is pricing structured?
    a: Pricing is based on scope. After our intro call you get a clear, itemized proposal with no surprises.

  - q: Can you work alongside our team or agency?
    a: Absolutely. I plug into your existing team, planner or agency and cover whatever gaps you have.

  - q: What size events do you handle?
    a: Everything from intimate dinners to multi-day offsites and conferences.
