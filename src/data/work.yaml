# WORK PAGE
#
# PHOTOS: you don't list photos here anymore. Just upload them to
#   src/assets/images/work/
# and name each file like this:
#
#   CLIENTCODE_Event Title_SERVICE_number.jpg
#   e.g.  PBP_Client Appreciation_FS_8.jpg
#
#   CLIENTCODE  from src/data/clients.yaml (PBP, SHOPIFY, EFRY …)
#   Event Title shown as the caption
#   SERVICE     FS = Full Service, PE = Pre-Event, OS = On-Site, VC = Virtual
#   number      any number, just to keep file names unique
#
# The photo then appears in the gallery with the right caption and filters.
# ============================================

