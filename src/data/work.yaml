intro: Over my career, I have planned and executed over 95 events, including town halls, multi-day off-sites, product launches, AGMs, and client appreciation dinners. I've also negotiated over 45 vendor contracts and secured more than 15 sponsorships for cost-effective and high-value execution.
heading: Projects Over the Years
subtitle: My past work reflects a focus on events that inform audiences, engage prospects, and celebrate key moments.
