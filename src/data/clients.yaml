# ============================================
# CLIENTS
# One entry per organization. This list powers:
#   - the logo wall on the homepage (in this order)
#   - the Corporate / Nonprofit / Community filters on the Work page
#
# code:   short code used at the start of photo file names (e.g. PBP_...)
# name:   full name shown on the site
# sector: Corporate, Nonprofit, Community or Private
# logo:   file name in src/assets/images/logos/ (leave blank if no logo)
#
# To add a client: copy a block, change the values, upload the logo.
# ============================================

