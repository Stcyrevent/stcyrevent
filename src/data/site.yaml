hero:
  headline: St. Cyr Event Co.
  tagline: >-
    A freelance consultancy specializing in event coordination, project
    management, and marketing support for lean teams who need extra capacity.
about:
  intro: >-
    I help organizations plan and execute impactful events that feel thoughtful,
    organized, and aligned with their goals.
  story: >-
    I chose my last name, St. Cyr, as the foundation of my business because it
    reflects how I work. I’ve learned that when events are planned with
    sincerity and care, the quality shows; leading to better experiences,
    stronger relationships, and work you can truly stand behind.
  experience: >-
    With close to a decade of experience across corporate and non-profit
    sectors, I bring a calm, solutions-oriented approach to every engagement.
    Whether it's a multi-day offsite, a product launch, or a community event I
    offer practical support that helps teams stay focused and confident.
  headshot: /src/assets/images/site/about/headshot.jpg
