# About section. Headshot: src/assets/images/headshot.jpg
about:
  heading: Hi, I'm Kendra.
  intro: I help organizations plan and run events that feel thoughtful, organized and true to their goals.
  experience: For close to a decade I've worked with corporate and nonprofit teams on offsites, launches and community events.
  story: I chose my last name, St. Cyr, as the foundation of my business because it reflects how I work. I've learned that when events are planned with sincerity and care, the quality shows, leading to better experiences, stronger relationships, and work you can truly stand behind.

services_preview:
  heading: How I can help
  subheading: Bring me in for the whole event, or just where you need backup.

process:
  heading: How we'll work together
  steps:
    - title: Intro call
      text: Tell me about the event and where you're stretched.
    - title: Proposal
      text: I'll recommend the right support, with a clear scope.
    - title: Plan
      text: I plug into your team and keep everything on track.
    - title: Run the day
      text: On site from setup to debrief, so you can enjoy it.

testimonials_heading: What clients say
testimonials_heading_soft: about working with Kendra.

# Closing call-to-action (shown at the bottom of every page)
closing:
  heading: Have an event coming up?
  text: Let's make it thoughtful, organized and stress-free.

# ---------- CONTACT PAGE ----------
contact:
  heading: Let's talk
  intro: Tell me what you're planning. I'd love to help.
  formspree_url: https://formspree.io/f/mlgpynvq
  checklist:
    - Full planning, or just the pieces you need
    - Corporate and nonprofit events of any size
    - Calm, organized support from start to finish
    - Trusted by teams at Shopify, PayByPhone and more
  success: Thanks! I'll be in touch soon.
