# ============================================
# SERVICES
# Edit the text for each service. Keep the indentation.
#
# code:   FS, PE, OS or VC — matches the code at the end of photo
#         file names, so "See examples" shows the right photos
# color:  yellow, lime, pink or sky (from src/styles/theme.css)
# level:  1–4, how hands-on this service is (shown as a small meter)
# ============================================

heading: Event help, right where you need it.
intro: Less stress for your team, a smoother event for your guests. Pick the support that fits.

services:
  - code: FS
    title: Full Service
    full_title: Full Service Event Coordination
    color: yellow
    level: 4
    client_voice: We don't have anyone to run this.
    short: No event lead? I'll own it from planning to wrap-up.
    for: For teams without an event lead.
    outcome: One contact, kickoff to debrief.
    items:
      - End-to-end planning and logistics
      - Budget and vendor management
      - Program and experience design
      - On-site, virtual or hybrid execution

  - code: PE
    title: Pre-Event Support
    full_title: Pre-Event Support Coordination
    color: lime
    level: 3
    client_voice: We have a planner, but the last weeks are a lot.
    short: Have a planner? I'll help through the busy final weeks.
    for: For teams with a planner who need hands in the final weeks.
    outcome: Nothing slips in the busiest stretch.
    items:
      - Run-of-show and production details
      - Rehearsals and speaker briefings
      - Final checks on vendors and timelines
      - Real-time troubleshooting on the day

  - code: OS
    title: On-Site
    full_title: On-Site Management
    color: pink
    level: 2
    client_voice: We need a pro on the ground to keep the day running smoothly.
    short: A second person on the day, from setup to teardown.
    for: For teams who need a second person on the ground.
    outcome: You host. I keep the day on schedule.
    items:
      - Vendor arrival and setup
      - Run-of-show and timing
      - Attendee flow
      - Supervision, setup to teardown

  - code: VC
    title: Virtual Consultation
    full_title: Virtual Event Consultation
    color: sky
    level: 1
    client_voice: We're running it, but want a pro in our corner.
    short: Running it yourself? Get an expert in your corner.
    for: For teams running their own event who want expert guidance.
    outcome: Pro support without a full planner.
    items:
      - Platform setup and management
      - Planning and logistics advice
      - Speaker tech checks and rehearsals
      - Day-of execution and audience monitoring

addons:
  heading: Add-on services
  heading_soft:
  text: When needed, I collaborate with trusted partners to offer add-on services.
  items:
    - Event photography
    - Branding & creative strategy
    - Digital & print design
    - Web design
    - Social media management
